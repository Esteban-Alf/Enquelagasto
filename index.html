<style>
:root{
  --bg:#F7F1E7;
  --bg-2:#F1E8D8;
  --ink:#1B1A16;
  --ink-soft:#54514A;
  --ink-faint:#8F8A7E;
  --card:#FFFDF8;
  --line:#E6DCC9;
  --line-soft:#EFE7D6;
  --emerald:#0E6B4E;
  --emerald-soft:#E3F1EA;
  --coral:#CF4A2E;
  --coral-soft:#FBE6DF;
  --amber:#D9962B;
  --amber-soft:#F7ECD3;
  --shadow:0 1px 2px rgba(27,26,22,.04), 0 8px 24px rgba(27,26,22,.06);
  --shadow-lg:0 12px 48px rgba(27,26,22,.16);
  --r:18px;
  --r-sm:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Manrope',system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  font-size:15px;
  line-height:1.45;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.serif{font-family:'Fraunces',Georgia,serif}
.hidden{display:none !important}

/* ---------------- AUTH ---------------- */
#auth{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:
    radial-gradient(120% 80% at 90% -10%, var(--amber-soft) 0%, transparent 55%),
    radial-gradient(100% 70% at 0% 110%, var(--emerald-soft) 0%, transparent 50%),
    var(--bg);
}
.auth-card{
  width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);
  border-radius:24px;box-shadow:var(--shadow-lg);padding:34px 28px;
}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.brand-mark{
  width:38px;height:38px;border-radius:11px;background:var(--emerald);color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:20px;
  font-family:'Fraunces',serif;
}
.brand-name{font-family:'Fraunces',serif;font-weight:600;font-size:21px;letter-spacing:-.01em}
.auth-card h1{font-family:'Fraunces',serif;font-weight:600;font-size:26px;margin:18px 0 4px;letter-spacing:-.02em}
.auth-card p.sub{color:var(--ink-soft);margin:0 0 22px;font-size:14px}
.tabs{display:flex;background:var(--bg-2);border-radius:12px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;padding:9px;border-radius:9px;font-weight:600;font-size:14px;color:var(--ink-soft)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px}
.field input{
  width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;
  background:var(--bg);color:var(--ink);outline:none;transition:.15s;
}
.field input:focus{border-color:var(--emerald);background:var(--card);box-shadow:0 0 0 3px var(--emerald-soft)}
.btn-primary{
  width:100%;padding:13px;background:var(--emerald);color:#fff;border-radius:12px;
  font-weight:700;font-size:15px;transition:.15s;margin-top:4px;
}
.btn-primary:hover{filter:brightness(1.07)}
.btn-primary:active{transform:translateY(1px)}
.btn-primary:disabled{opacity:.55;cursor:default}
.auth-msg{margin-top:14px;font-size:13px;text-align:center;min-height:18px}
.auth-msg.err{color:var(--coral)}
.auth-msg.ok{color:var(--emerald)}
.demo-badge{
  margin-top:18px;font-size:12px;text-align:center;color:var(--ink-faint);
  background:var(--amber-soft);padding:9px 12px;border-radius:10px;line-height:1.4;
}

/* ---------------- APP SHELL ---------------- */
#app{display:none;min-height:100vh}
.shell{display:flex;min-height:100vh}
.sidebar{display:none}
.main{flex:1;min-width:0;padding-bottom:84px}
.topbar{
  position:sticky;top:0;z-index:30;background:rgba(247,241,231,.85);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line-soft);
  padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.topbar .brand-name{font-size:18px}
.topbar .who{display:flex;align-items:center;gap:8px}
.avatar{
  width:34px;height:34px;border-radius:50%;background:var(--emerald);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:14px;
}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink-soft)}
.icon-btn:hover{background:var(--bg-2)}
.content{padding:18px 16px 24px;max-width:1140px;margin:0 auto}
.view-title{font-family:'Fraunces',serif;font-weight:600;font-size:24px;letter-spacing:-.02em;margin:2px 0 16px}

/* segmented controls */
.seg{display:flex;gap:6px;background:var(--bg-2);padding:5px;border-radius:13px;flex-wrap:wrap}
.seg button{padding:8px 14px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--ink-soft);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.controls-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}

/* cards */
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.kpi .lbl{font-size:12.5px;font-weight:600;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:7px}
.kpi .val{font-family:'Fraunces',serif;font-weight:600;font-size:30px;letter-spacing:-.02em;margin-top:8px}
.kpi .val.num{font-family:'Fraunces',serif}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot.in{background:var(--emerald)} .dot.out{background:var(--coral)} .dot.bal{background:var(--amber)}
.txt-in{color:var(--emerald)} .txt-out{color:var(--coral)} .txt-bal{color:var(--ink)}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-h h3{font-family:'Fraunces',serif;font-weight:600;font-size:17px;margin:0;letter-spacing:-.01em}
.card-h .link{font-size:13px;font-weight:600;color:var(--emerald)}

/* category bars */
.catbar{margin-bottom:13px}
.catbar:last-child{margin-bottom:0}
.catbar .top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px}
.catbar .top .nm{font-weight:600;display:flex;align-items:center;gap:8px}
.catbar .track{height:8px;background:var(--bg-2);border-radius:6px;overflow:hidden}
.catbar .fill{height:100%;border-radius:6px;background:var(--emerald);transition:width .5s cubic-bezier(.2,.8,.2,1)}

/* movement list */
.mv{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--line-soft)}
.mv:last-child{border-bottom:none}
.mv-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex-shrink:0}
.mv-ic.in{background:var(--emerald-soft)} .mv-ic.out{background:var(--coral-soft)}
.mv-body{flex:1;min-width:0}
.mv-body .t{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv-body .s{font-size:12.5px;color:var(--ink-faint);display:flex;align-items:center;gap:7px;margin-top:1px;flex-wrap:wrap}
.mv-amt{font-weight:700;font-size:15px;white-space:nowrap}
.chip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--bg-2);color:var(--ink-soft)}
.chip.share{background:var(--amber-soft);color:#9a6913}
.chip.fix{background:var(--emerald-soft);color:var(--emerald)}
.empty{text-align:center;padding:38px 16px;color:var(--ink-faint)}
.empty .big{font-size:34px;margin-bottom:8px}

/* vencimientos */
.venc{display:flex;align-items:center;gap:13px;padding:14px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:var(--card)}
.venc.due{border-color:var(--coral);background:var(--coral-soft)}
.venc.soon{border-color:var(--amber);background:var(--amber-soft)}
.venc .when{text-align:center;flex-shrink:0;width:50px}
.venc .when .d{font-family:'Fraunces',serif;font-weight:600;font-size:22px;line-height:1}
.venc .when .m{font-size:11px;text-transform:uppercase;color:var(--ink-faint);font-weight:600}

/* config */
.cfg-cat{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.cfg-cat:last-child{border-bottom:none}
.swatch{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:14px;flex-shrink:0}
.cfg-cat .nm{flex:1;font-weight:600;font-size:14.5px}
.cfg-cat .del{color:var(--ink-faint);padding:6px}
.cfg-cat .del:hover{color:var(--coral)}
.add-inline{display:flex;gap:8px;margin-top:14px}
.add-inline input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--bg)}
.add-inline button{padding:0 16px;background:var(--emerald);color:#fff;border-radius:11px;font-weight:700}

/* bottom nav */
.bottomnav{
  position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(255,253,248,.92);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);
  display:flex;align-items:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));
}
.bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;color:var(--ink-faint);font-size:10.5px;font-weight:600}
.bottomnav button.on{color:var(--emerald)}
.bottomnav button svg{width:23px;height:23px}
.fab-wrap{flex:1;display:flex;justify-content:center}
.fab{
  width:54px;height:54px;border-radius:50%;background:var(--emerald);color:#fff;
  display:grid;place-items:center;box-shadow:0 6px 18px rgba(14,107,78,.4);margin-top:-22px;
  transition:.15s;
}
.fab:active{transform:scale(.93)}
.fab svg{width:26px;height:26px}

/* ---------------- WIZARD / MODAL ---------------- */
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(27,26,22,.45);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.show{opacity:1;pointer-events:auto}
.sheet{
  width:100%;max-width:540px;background:var(--card);border-radius:26px 26px 0 0;
  max-height:94vh;overflow-y:auto;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  padding:8px 0 0;
}
.sheet-bg.show .sheet{transform:translateY(0)}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 4px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:8px 20px 6px}
.sheet-head .step-i{font-size:12.5px;font-weight:700;color:var(--ink-faint);letter-spacing:.03em}
.sheet-head .x{font-size:22px;color:var(--ink-faint);width:32px;height:32px;border-radius:9px}
.sheet-head .x:hover{background:var(--bg-2)}
.progress{height:4px;background:var(--bg-2);margin:0 20px;border-radius:3px;overflow:hidden}
.progress .b{height:100%;background:var(--emerald);border-radius:3px;transition:width .3s}
.sheet-body{padding:18px 20px 4px}
.sheet-body h2{font-family:'Fraunces',serif;font-weight:600;font-size:22px;margin:0 0 4px;letter-spacing:-.02em}
.sheet-body .hint{color:var(--ink-soft);font-size:13.5px;margin:0 0 18px}
.bigchoice{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bigchoice button{
  padding:22px 14px;border:2px solid var(--line);border-radius:16px;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;gap:9px;font-weight:700;font-size:15px;transition:.15s;
}
.bigchoice button .em{font-size:30px}
.bigchoice button.in.sel{border-color:var(--emerald);background:var(--emerald-soft);color:var(--emerald)}
.bigchoice button.out.sel{border-color:var(--coral);background:var(--coral-soft);color:var(--coral)}
.amount-box{text-align:center;padding:14px 0 6px}
.amount-box .cur{font-family:'Fraunces',serif;font-size:26px;color:var(--ink-faint);vertical-align:top}
.amount-box input{
  font-family:'Fraunces',serif;font-weight:600;font-size:52px;text-align:center;border:none;
  background:none;outline:none;width:100%;color:var(--ink);letter-spacing:-.02em;
}
.amount-box input.out{color:var(--coral)} .amount-box input.in{color:var(--emerald)}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chips .c{padding:10px 15px;border:1px solid var(--line);border-radius:30px;font-weight:600;font-size:14px;background:var(--bg);display:flex;align-items:center;gap:7px}
.chips .c.sel{border-color:var(--emerald);background:var(--emerald-soft);color:var(--emerald)}
.chips .c.add{border-style:dashed;color:var(--ink-soft)}
.frm label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin:16px 0 7px}
.frm input,.frm select,.frm textarea{
  width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);outline:none;
}
.frm input:focus,.frm select:focus,.frm textarea:focus{border-color:var(--emerald);box-shadow:0 0 0 3px var(--emerald-soft)}
.toggle2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toggle2 button{padding:12px;border:1px solid var(--line);border-radius:12px;font-weight:600;background:var(--bg);font-size:14px}
.toggle2 button.sel{border-color:var(--emerald);background:var(--emerald-soft);color:var(--emerald)}
.photo-drop{
  border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--ink-faint);
  font-size:14px;cursor:pointer;font-weight:600;
}
.photo-drop:hover{border-color:var(--emerald);color:var(--emerald)}
.photo-prev{position:relative;margin-top:12px;border-radius:14px;overflow:hidden}
.photo-prev img{width:100%;display:block;max-height:240px;object-fit:cover}
.photo-prev .rm{position:absolute;top:8px;right:8px;background:rgba(27,26,22,.7);color:#fff;width:30px;height:30px;border-radius:50%;font-size:16px}
.summary{background:var(--bg);border-radius:14px;padding:16px;margin-top:6px}
.summary .row{display:flex;justify-content:space-between;padding:7px 0;font-size:14px;border-bottom:1px solid var(--line-soft)}
.summary .row:last-child{border-bottom:none}
.summary .row .k{color:var(--ink-soft)}
.summary .row .v{font-weight:700;text-align:right}
.sheet-foot{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line-soft);padding:14px 20px calc(16px + env(safe-area-inset-bottom));display:flex;gap:10px}
.sheet-foot button{flex:1;padding:14px;border-radius:13px;font-weight:700;font-size:15px}
.btn-back{background:var(--bg-2);color:var(--ink-soft)}
.btn-next{background:var(--emerald);color:#fff}
.btn-next:disabled{opacity:.45}

/* toast */
#toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);z-index:80;background:var(--ink);color:#fff;padding:12px 18px;border-radius:13px;font-size:14px;font-weight:600;opacity:0;transition:.25s;box-shadow:var(--shadow-lg)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------------- DESKTOP ---------------- */
@media(min-width:900px){
  .main{padding-bottom:0}
  .bottomnav{display:none}
  .sidebar{
    display:flex;flex-direction:column;width:248px;flex-shrink:0;background:var(--card);
    border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh;
  }
  .sidebar .brand{padding:0 8px 22px}
  .sidebar nav{display:flex;flex-direction:column;gap:3px;flex:1}
  .sidebar nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;font-weight:600;font-size:14.5px;color:var(--ink-soft);text-align:left}
  .sidebar nav button svg{width:20px;height:20px}
  .sidebar nav button.on{background:var(--emerald-soft);color:var(--emerald)}
  .sidebar nav button:hover:not(.on){background:var(--bg-2)}
  .sidebar .side-add{margin-top:8px;padding:12px;background:var(--emerald);color:#fff;border-radius:12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
  .sidebar .side-user{display:flex;align-items:center;gap:10px;padding:10px 8px;margin-top:auto;border-top:1px solid var(--line-soft)}
  .sidebar .side-user .nm{font-size:13.5px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .topbar{display:none}
  .content{padding:28px 32px}
  .view-title{font-size:30px;margin-bottom:22px}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .dash-2col{grid-template-columns:1.3fr 1fr;align-items:start}
  .sheet-bg{align-items:center}
  .sheet{border-radius:24px;max-width:520px}
}
@media(min-width:600px) and (max-width:899px){
  .kpis{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>

<!-- ===================== APP ===================== -->

    <aside class="sidebar">

        </button>
      </div>
    </aside>

    <!-- Main -->
    <div class="main">

        <div class="brand"><div class="brand-mark">$</div><div class="brand-name">En qué la gasto</div></div>

          <div class="avatar" id="topAvatar">E</div>
          <button class="icon-btn" onclick="doLogout()" title="Salir">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>

<!-- ===================== WIZARD ===================== -->
<div class="sheet-bg" id="sheetBg">
  <div class="sheet" id="sheet">
    <div class="grab"></div>
    <div class="sheet-head">
      <span class="step-i" id="stepInd">Paso 1 de 5</span>
      <button class="x" onclick="closeWizard()">✕</button>
    </div>
    <div class="progress"><div class="b" id="progBar" style="width:20%"></div></div>
    <div class="sheet-body" id="wizBody"></div>
    <div class="sheet-foot">
      <button class="btn-back" id="wizBack" onclick="wizPrev()">Atrás</button>
      <button class="btn-next" id="wizNext" onclick="wizNext()">Siguiente</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =========================================================
   CAPA DE DATOS  (Supabase si está configurado, si no demo)
   ========================================================= */
const USE_SUPABASE = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY);
let sb = null;
if (USE_SUPABASE) sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

const fmt = (n)=> new Intl.NumberFormat(CONFIG.LOCALE,{style:'currency',currency:CONFIG.MONEDA,maximumFractionDigits:0}).format(n||0);
const uid = ()=> 'id_'+Math.random().toString(36).slice(2,10);
const todayISO = ()=> new Date().toISOString().slice(0,10);

/* ---- almacén demo en memoria ---- */
const demo = {
  user:null,
  categorias:[],
  movimientos:[],
  seed(u){
    this.user = u;
    this.categorias = [
      {id:uid(),nombre:'Sueldo',tipo:'ingreso',color:'#0E6B4E'},
      {id:uid(),nombre:'Supermercado',tipo:'gasto',color:'#CF4A2E'},
      {id:uid(),nombre:'Alquiler',tipo:'gasto',color:'#D9962B'},
      {id:uid(),nombre:'Salidas',tipo:'gasto',color:'#7A5CC4'},
      {id:uid(),nombre:'Transporte',tipo:'gasto',color:'#2E7DCF'},
      {id:uid(),nombre:'Servicios',tipo:'gasto',color:'#3FA796'},
    ];
    const cat = (n)=> this.categorias.find(c=>c.nombre===n).id;
    const d = (off)=>{const x=new Date();x.setDate(x.getDate()-off);return x.toISOString().slice(0,10)};
    const dF = (off)=>{const x=new Date();x.setDate(x.getDate()+off);return x.toISOString().slice(0,10)};
    this.movimientos = [
      {id:uid(),tipo:'ingreso',importe:850000,categoria_id:cat('Sueldo'),comentario:'Sueldo mayo',ambito:'individual',es_fijo:true,frecuencia:'mensual',fecha:d(2),fecha_vencimiento:null,foto:null},
      {id:uid(),tipo:'gasto',importe:42000,categoria_id:cat('Supermercado'),comentario:'Compra semanal',ambito:'compartido',es_fijo:false,frecuencia:'unico',fecha:d(1),fecha_vencimiento:null,foto:null},
      {id:uid(),tipo:'gasto',importe:18500,categoria_id:cat('Salidas'),comentario:'Cena con amigos',ambito:'individual',es_fijo:false,frecuencia:'unico',fecha:d(3),fecha_vencimiento:null,foto:null},
      {id:uid(),tipo:'gasto',importe:9200,categoria_id:cat('Transporte'),comentario:'SUBE',ambito:'individual',es_fijo:false,frecuencia:'unico',fecha:d(4),fecha_vencimiento:null,foto:null},
      {id:uid(),tipo:'gasto',importe:320000,categoria_id:cat('Alquiler'),comentario:'Alquiler depto',ambito:'compartido',es_fijo:true,frecuencia:'mensual',fecha:d(6),fecha_vencimiento:dF(4),foto:null},
      {id:uid(),tipo:'gasto',importe:28000,categoria_id:cat('Servicios'),comentario:'Luz + gas',ambito:'compartido',es_fijo:true,frecuencia:'mensual',fecha:d(8),fecha_vencimiento:dF(2),foto:null},
      {id:uid(),tipo:'gasto',importe:15900,categoria_id:cat('Servicios'),comentario:'Internet',ambito:'compartido',es_fijo:true,frecuencia:'mensual',fecha:d(10),fecha_vencimiento:dF(9),foto:null},
    ];
  }
};

const db = {
  async signUp(email,pass,nombre){
    if(USE_SUPABASE){
      const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:{nombre}}});
      if(error) throw error;
      return data.user;
    }
    const u={id:uid(),email,nombre:nombre||email.split('@')[0]}; demo.seed(u); return u;
  },
  async signIn(email,pass){
    if(USE_SUPABASE){
      const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error) throw error;
      return data.user;
    }
    const u={id:uid(),email,nombre:email.split('@')[0]}; demo.seed(u); return u;
  },
  async signOut(){ if(USE_SUPABASE) await sb.auth.signOut(); demo.user=null; },
  async currentUser(){
    if(USE_SUPABASE){ const {data}=await sb.auth.getUser(); return data.user||null; }
    return demo.user;
  },
  async listCategorias(){
    if(USE_SUPABASE){
      const {data,error}=await sb.from('categorias').select('*').order('nombre');
      if(error) throw error; return data;
    }
    return [...demo.categorias];
  },
  async createCategoria(c){
    if(USE_SUPABASE){
      const u=await this.currentUser();
      const {data,error}=await sb.from('categorias').insert({...c,user_id:u.id}).select().single();
      if(error) throw error; return data;
    }
    const row={id:uid(),...c}; demo.categorias.push(row); return row;
  },
  async deleteCategoria(id){
    if(USE_SUPABASE){ const {error}=await sb.from('categorias').delete().eq('id',id); if(error) throw error; return; }
    demo.categorias = demo.categorias.filter(c=>c.id!==id);
  },
  async listMovimientos(){
    if(USE_SUPABASE){
      const {data,error}=await sb.from('movimientos').select('*').order('fecha',{ascending:false});
      if(error) throw error; return data;
    }
    return [...demo.movimientos].sort((a,b)=> (a.fecha<b.fecha?1:-1));
  },
  async createMovimiento(m){
    if(USE_SUPABASE){
      const u=await this.currentUser();
      const {data,error}=await sb.from('movimientos').insert({...m,user_id:u.id}).select().single();
      if(error) throw error; return data;
    }
    const row={id:uid(),...m}; demo.movimientos.unshift(row); return row;
  },
  async deleteMovimiento(id){
    if(USE_SUPABASE){ const {error}=await sb.from('movimientos').delete().eq('id',id); if(error) throw error; return; }
    demo.movimientos = demo.movimientos.filter(m=>m.id!==id);
  }
};

/* =========================================================
   ESTADO
   ========================================================= */
const state = {
  user:null,
  categorias:[],
  movimientos:[],
  view:'dashboard',
  periodo:'mes',      // dia|semana|mes|anio
  filtroAmbito:'todos' // todos|individual|compartido
};

/* =========================================================
   AUTH UI
   ========================================================= */
let authMode='login';
function setAuthMode(m){
  authMode=m;
  document.getElementById('tabLogin').classList.toggle('on',m==='login');
  document.getElementById('tabReg').classList.toggle('on',m==='register');
  document.getElementById('fieldName').style.display = m==='register'?'block':'none';
  document.getElementById('authTitle').textContent = m==='register'?'Creá tu cuenta':'Hola de nuevo';
  document.getElementById('authSub').textContent = m==='register'?'Empezá a registrar tus gastos':'Ingresá para ver tus gastos';
  document.getElementById('authBtn').textContent = m==='register'?'Crear cuenta':'Ingresar';
  document.getElementById('authMsg').textContent='';
}
function authError(t){ const e=document.getElementById('authMsg'); e.className='auth-msg err'; e.textContent=t; }
async function doAuth(){
  const email=document.getElementById('inEmail').value.trim();
  const pass=document.getElementById('inPass').value;
  const nombre=document.getElementById('inName').value.trim();
  if(!email||!pass){ authError('Completá email y contraseña.'); return; }
  const btn=document.getElementById('authBtn'); btn.disabled=true; btn.textContent='...';
  try{
    const u = authMode==='register' ? await db.signUp(email,pass,nombre) : await db.signIn(email,pass);
    if(!u){ // supabase puede pedir confirmar email
      const e=document.getElementById('authMsg'); e.className='auth-msg ok';
      e.textContent='Revisá tu email para confirmar la cuenta.'; btn.disabled=false; btn.textContent='Crear cuenta'; return;
    }
    await enterApp(u);
  }catch(err){
    authError(err.message||'Error de autenticación.');
    btn.disabled=false; btn.textContent= authMode==='register'?'Crear cuenta':'Ingresar';
  }
}
async function doLogout(){ await db.signOut(); location.reload(); }

async function enterApp(u){
  state.user = { id:u.id, nombre: u.user_metadata?.nombre || u.nombre || (u.email||'').split('@')[0], email:u.email };
  document.getElementById('auth').style.display='none';
  document.getElementById('app').style.display='block';
  const initial=(state.user.nombre||'U')[0].toUpperCase();
  document.getElementById('topAvatar').textContent=initial;
  document.getElementById('sideAvatar').textContent=initial;
  document.getElementById('sideName').textContent=state.user.nombre;
  await refreshData();
  await seedDefaultsIfEmpty();
  buildNav();
  render();
}
async function refreshData(){
  state.categorias = await db.listCategorias();
  state.movimientos = await db.listMovimientos();
}
async function seedDefaultsIfEmpty(){
  if(state.categorias.length>0) return;
  const defaults=[
    {nombre:'Sueldo',tipo:'ingreso',color:'#0E6B4E'},
    {nombre:'Supermercado',tipo:'gasto',color:'#CF4A2E'},
    {nombre:'Alquiler',tipo:'gasto',color:'#D9962B'},
    {nombre:'Salidas',tipo:'gasto',color:'#7A5CC4'},
    {nombre:'Transporte',tipo:'gasto',color:'#2E7DCF'},
    {nombre:'Servicios',tipo:'gasto',color:'#3FA796'},
  ];
  for(const c of defaults){ try{ await db.createCategoria(c); }catch(e){} }
  state.categorias = await db.listCategorias();
}

/* =========================================================
   NAV
   ========================================================= */
const NAV=[
  {k:'dashboard',label:'Inicio',icon:'<path d="M3 12l9-9 9 9M5 10v10h5v-6h4v6h5V10"/>'},
  {k:'movimientos',label:'Movimientos',icon:'<path d="M4 6h16M4 12h16M4 18h10"/>'},
  {k:'add',label:'',icon:'<path d="M12 5v14M5 12h14"/>'},
  {k:'vencimientos',label:'Vencim.',icon:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>'},
  {k:'config',label:'Ajustes',icon:'<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.5-2.4 1a7 7 0 0 0-1.7-1L14.5 2h-5l-.3 2.6a7 7 0 0 0-1.7 1l-2.4-1-2 3.5L3 11a7 7 0 0 0 0 2l-2 1.5 2 3.5 2.4-1a7 7 0 0 0 1.7 1l.3 2.5h5l.3-2.6a7 7 0 0 0 1.7-1l2.4 1 2-3.5-2-1.4a7 7 0 0 0 .1-1z"/>'}
];
function svg(p){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`}
function buildNav(){
  // bottom
  const bn=document.getElementById('bottomNav'); bn.innerHTML='';
  NAV.forEach(n=>{
    if(n.k==='add'){
      const w=document.createElement('div'); w.className='fab-wrap';
      const b=document.createElement('button'); b.className='fab'; b.innerHTML=svg(n.icon);
      b.onclick=openWizard; w.appendChild(b); bn.appendChild(w); return;
    }
    const b=document.createElement('button'); b.dataset.k=n.k;
    b.innerHTML=svg(n.icon)+`<span>${n.label}</span>`;
    b.onclick=()=>go(n.k); bn.appendChild(b);
  });
  // side
  const sn=document.getElementById('sideNav'); sn.innerHTML='';
  NAV.filter(n=>n.k!=='add').forEach(n=>{
    const b=document.createElement('button'); b.dataset.k=n.k;
    b.innerHTML=svg(n.icon)+`<span>${n.label||'Inicio'}</span>`;
    b.onclick=()=>go(n.k); sn.appendChild(b);
  });
  markNav();
}
function markNav(){
  document.querySelectorAll('#bottomNav button[data-k], #sideNav button[data-k]').forEach(b=>{
    b.classList.toggle('on', b.dataset.k===state.view);
  });
}
function go(k){ state.view=k; markNav(); render(); window.scrollTo(0,0); }

/* =========================================================
   HELPERS DE PERÍODO / FILTROS
   ========================================================= */
function rangeFor(periodo){
  const now=new Date(); const end=new Date(now); end.setHours(23,59,59,999);
  const start=new Date(now); start.setHours(0,0,0,0);
  if(periodo==='semana'){ const day=(start.getDay()+6)%7; start.setDate(start.getDate()-day); }
  else if(periodo==='mes'){ start.setDate(1); }
  else if(periodo==='anio'){ start.setMonth(0,1); }
  return {start,end};
}
function filteredMovs(){
  const {start,end}=rangeFor(state.periodo);
  return state.movimientos.filter(m=>{
    const f=new Date(m.fecha+'T12:00:00');
    if(f<start||f>end) return false;
    if(state.filtroAmbito!=='todos' && m.ambito!==state.filtroAmbito) return false;
    return true;
  });
}
function catById(id){ return state.categorias.find(c=>c.id===id); }
function catName(id){ const c=catById(id); return c?c.nombre:'Sin categoría'; }
function catColor(id){ const c=catById(id); return c?c.color:'#8F8A7E'; }

/* =========================================================
   RENDER PRINCIPAL
   ========================================================= */
function render(){
  const v=state.view;
  if(v==='dashboard') renderDashboard();
  else if(v==='movimientos') renderMovimientos();
  else if(v==='vencimientos') renderVencimientos();
  else if(v==='config') renderConfig();
}

function periodLabel(){return {dia:'hoy',semana:'esta semana',mes:'este mes',anio:'este año'}[state.periodo]}

function segPeriodo(){
  return `<div class="seg" id="segP">
    ${['dia','semana','mes','anio'].map(p=>`<button class="${state.periodo===p?'on':''}" onclick="setPeriodo('${p}')">${({dia:'Día',semana:'Semana',mes:'Mes',anio:'Año'})[p]}</button>`).join('')}
  </div>`;
}
function segAmbito(){
  return `<div class="seg">
    ${[['todos','Todos'],['individual','Individual'],['compartido','Compartido']].map(([k,l])=>`<button class="${state.filtroAmbito===k?'on':''}" onclick="setAmbito('${k}')">${l}</button>`).join('')}
  </div>`;
}
function setPeriodo(p){ state.periodo=p; render(); }
function setAmbito(a){ state.filtroAmbito=a; render(); }

function renderDashboard(){
  const movs=filteredMovs();
  const ingresos=movs.filter(m=>m.tipo==='ingreso').reduce((s,m)=>s+Number(m.importe),0);
  const gastos=movs.filter(m=>m.tipo==='gasto').reduce((s,m)=>s+Number(m.importe),0);
  const balance=ingresos-gastos;

  // gastos por categoría
  const byCat={};
  movs.filter(m=>m.tipo==='gasto').forEach(m=>{byCat[m.categoria_id]=(byCat[m.categoria_id]||0)+Number(m.importe)});
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const maxCat=cats.length?cats[0][1]:1;

  // próximos vencimientos
  const venc=upcoming().slice(0,3);

  const recientes=[...movs].sort((a,b)=> (a.fecha<b.fecha?1:-1)).slice(0,5);

  const html=`
    <div class="view-title">Hola, ${state.user.nombre} 👋</div>
    <div class="controls-row">${segPeriodo()}${segAmbito()}</div>

    <div class="grid kpis" style="margin-bottom:14px">
      <div class="card kpi"><div class="lbl"><span class="dot bal"></span>Balance ${periodLabel()}</div><div class="val num ${balance<0?'txt-out':'txt-in'}">${fmt(balance)}</div></div>
      <div class="card kpi"><div class="lbl"><span class="dot in"></span>Ingresos</div><div class="val num txt-in">${fmt(ingresos)}</div></div>
      <div class="card kpi"><div class="lbl"><span class="dot out"></span>Gastos</div><div class="val num txt-out">${fmt(gastos)}</div></div>
      <div class="card kpi"><div class="lbl">Movimientos</div><div class="val num">${movs.length}</div></div>
    </div>

    <div class="grid dash-2col">
      <div class="card">
        <div class="card-h"><h3>Gastos por categoría</h3></div>
        ${cats.length? cats.map(([id,val])=>`
          <div class="catbar">
            <div class="top"><span class="nm"><span class="dot" style="background:${catColor(id)}"></span>${catName(id)}</span><span class="num" style="font-weight:700">${fmt(val)}</span></div>
            <div class="track"><div class="fill" style="width:${Math.max(4,val/maxCat*100)}%;background:${catColor(id)}"></div></div>
          </div>`).join('')
          : `<div class="empty"><div class="big">📊</div>Sin gastos ${periodLabel()}</div>`}
      </div>

      <div class="card">
        <div class="card-h"><h3>Próximos vencimientos</h3>${venc.length?`<span class="link" onclick="go('vencimientos')">Ver todos</span>`:''}</div>
        ${venc.length? venc.map(vencRow).join('')
          : `<div class="empty"><div class="big">✅</div>Nada por vencer</div>`}
      </div>
    </div>

    <div class="card" style="margin-top:14px">
      <div class="card-h"><h3>Movimientos recientes</h3><span class="link" onclick="go('movimientos')">Ver todos</span></div>
      ${recientes.length? recientes.map(movRow).join('') : `<div class="empty"><div class="big">🧾</div>Todavía no cargaste nada ${periodLabel()}<br><br><button class="btn-primary" style="max-width:220px;margin:0 auto" onclick="openWizard()">＋ Cargar el primero</button></div>`}
    </div>
  `;
  document.getElementById('content').innerHTML=html;
}

function movRow(m){
  const inc=m.tipo==='ingreso';
  return `<div class="mv">
    <div class="mv-ic ${inc?'in':'out'}">${inc?'↑':'↓'}</div>
    <div class="mv-body">
      <div class="t">${m.comentario||catName(m.categoria_id)}</div>
      <div class="s">
        <span>${catName(m.categoria_id)}</span>·<span>${fmtDate(m.fecha)}</span>
        ${m.ambito==='compartido'?'<span class="chip share">Compartido</span>':''}
        ${m.es_fijo?'<span class="chip fix">Fijo</span>':''}
        ${m.foto?'📷':''}
      </div>
    </div>
    <div class="mv-amt ${inc?'txt-in':'txt-out'}">${inc?'+':'−'}${fmt(m.importe)}</div>
  </div>`;
}

function fmtDate(iso){
  const d=new Date(iso+'T12:00:00');
  return d.toLocaleDateString(CONFIG.LOCALE,{day:'numeric',month:'short'});
}

/* ---- MOVIMIENTOS ---- */
function renderMovimientos(){
  const movs=filteredMovs();
  document.getElementById('content').innerHTML=`
    <div class="view-title">Movimientos</div>
    <div class="controls-row">${segPeriodo()}${segAmbito()}</div>
    <div class="card">
      ${movs.length? movs.map(m=>movRowDel(m)).join('') : `<div class="empty"><div class="big">🧾</div>Sin movimientos ${periodLabel()}</div>`}
    </div>`;
}
function movRowDel(m){
  return movRow(m).replace('</div>\n  </div>',
    `</div>\n    <button class="icon-btn" style="margin-left:6px;color:var(--ink-faint)" onclick="delMov('${m.id}')">
       <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
     </button>\n  </div>`);
}
async function delMov(id){
  if(!confirm('¿Eliminar este movimiento?')) return;
  await db.deleteMovimiento(id); await refreshData(); render(); toast('Movimiento eliminado');
}

/* ---- VENCIMIENTOS ---- */
function upcoming(){
  const today=new Date(); today.setHours(0,0,0,0);
  return state.movimientos
    .filter(m=>m.fecha_vencimiento)
    .map(m=>{ const d=new Date(m.fecha_vencimiento+'T12:00:00'); const days=Math.round((d-today)/86400000); return {...m,_d:d,_days:days}; })
    .filter(m=>m._days>=-3)
    .sort((a,b)=>a._d-b._d);
}
function vencRow(m){
  const cls = m._days<0?'due': m._days<=3?'due': m._days<=7?'soon':'';
  const lab = m._days<0?`Venció hace ${-m._days}d` : m._days===0?'Vence hoy' : m._days===1?'Mañana' : `En ${m._days} días`;
  const d=m._d||new Date(m.fecha_vencimiento+'T12:00:00');
  return `<div class="venc ${cls}">
    <div class="when"><div class="d num">${d.getDate()}</div><div class="m">${d.toLocaleDateString(CONFIG.LOCALE,{month:'short'})}</div></div>
    <div class="mv-body">
      <div class="t" style="font-weight:700">${m.comentario||catName(m.categoria_id)}</div>
      <div class="s"><b>${lab}</b> · ${catName(m.categoria_id)} ${m.ambito==='compartido'?'<span class="chip share">Compartido</span>':''}</div>
    </div>
    <div class="mv-amt txt-out">${fmt(m.importe)}</div>
  </div>`;
}
function renderVencimientos(){
  const list=upcoming();
  document.getElementById('content').innerHTML=`
    <div class="view-title">Vencimientos</div>
    <p style="color:var(--ink-soft);margin:-8px 0 18px">Pagos con fecha de vencimiento que se vienen.</p>
    ${list.length? list.map(vencRow).join('') : `<div class="card"><div class="empty"><div class="big">📅</div>No tenés pagos con fecha de vencimiento.<br><span style="font-size:13px">Cargá un gasto fijo o único con fecha y aparece acá.</span></div></div>`}`;
}

/* ---- CONFIG ---- */
function renderConfig(){
  const ing=state.categorias.filter(c=>c.tipo==='ingreso');
  const gas=state.categorias.filter(c=>c.tipo==='gasto');
  document.getElementById('content').innerHTML=`
    <div class="view-title">Configuración</div>

    <div class="card" style="margin-bottom:14px">
      <div class="card-h"><h3>Categorías de gasto</h3></div>
      <div id="listGasto">${gas.map(c=>cfgCat(c)).join('')||'<p style="color:var(--ink-faint)">Sin categorías todavía.</p>'}</div>
      <div class="add-inline">
        <input id="newGasto" placeholder="Nueva categoría de gasto" onkeydown="if(event.key==='Enter')addCat('gasto')">
        <button onclick="addCat('gasto')">Añadir</button>
      </div>
    </div>

    <div class="card" style="margin-bottom:14px">
      <div class="card-h"><h3>Categorías de ingreso</h3></div>
      <div id="listIngreso">${ing.map(c=>cfgCat(c)).join('')||'<p style="color:var(--ink-faint)">Sin categorías todavía.</p>'}</div>
      <div class="add-inline">
        <input id="newIngreso" placeholder="Nueva categoría de ingreso" onkeydown="if(event.key==='Enter')addCat('ingreso')">
        <button onclick="addCat('ingreso')">Añadir</button>
      </div>
    </div>

    <div class="card">
      <div class="card-h"><h3>Cuenta</h3></div>
      <div class="cfg-cat"><div class="swatch" style="background:var(--emerald)">${(state.user.nombre||'U')[0].toUpperCase()}</div><div class="nm">${state.user.nombre}<div style="font-weight:400;font-size:12.5px;color:var(--ink-faint)">${state.user.email||''}</div></div></div>
      <div style="margin-top:14px;font-size:12.5px;color:var(--ink-faint)">
        ${USE_SUPABASE?'🟢 Conectado a Supabase.':'🧪 Modo demo (en memoria). Pegá tus claves de Supabase en CONFIG para guardar de verdad.'}
      </div>
    </div>`;
}
const PALETTE=['#CF4A2E','#D9962B','#0E6B4E','#2E7DCF','#7A5CC4','#3FA796','#C2456E','#586068'];
function cfgCat(c){
  return `<div class="cfg-cat">
    <div class="swatch" style="background:${c.color}">${c.nombre[0].toUpperCase()}</div>
    <div class="nm">${c.nombre}</div>
    <button class="del" onclick="delCat('${c.id}')"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
  </div>`;
}
async function addCat(tipo){
  const input=document.getElementById(tipo==='gasto'?'newGasto':'newIngreso');
  const nombre=input.value.trim(); if(!nombre) return;
  const color=PALETTE[state.categorias.length % PALETTE.length];
  await db.createCategoria({nombre,tipo,color});
  await refreshData(); render(); toast('Categoría añadida');
}
async function delCat(id){
  if(!confirm('¿Eliminar categoría? Los movimientos viejos quedan sin categoría.')) return;
  await db.deleteCategoria(id); await refreshData(); render(); toast('Categoría eliminada');
}

/* =========================================================
   WIZARD DE CARGA
   ========================================================= */
let wiz=null;
const WIZ_STEPS=5;
function openWizard(){
  wiz={ step:0, tipo:null, importe:'', categoria_id:null, ambito:'individual',
        fecha:todayISO(), modo:'unico', frecuencia:'unico', fecha_vencimiento:'',
        comentario:'', foto:null };
  document.getElementById('sheetBg').classList.add('show');
  renderWiz();
}
function closeWizard(){ document.getElementById('sheetBg').classList.remove('show'); }
document.getElementById('sheetBg').addEventListener('click',e=>{ if(e.target.id==='sheetBg') closeWizard(); });

function renderWiz(){
  const s=wiz.step;
  document.getElementById('stepInd').textContent=`Paso ${s+1} de ${WIZ_STEPS}`;
  document.getElementById('progBar').style.width=((s+1)/WIZ_STEPS*100)+'%';
  document.getElementById('wizBack').style.visibility = s===0?'hidden':'visible';
  const next=document.getElementById('wizNext');
  next.textContent = s===WIZ_STEPS-1?'Guardar':'Siguiente';
  const body=document.getElementById('wizBody');

  if(s===0){
    body.innerHTML=`
      <h2>¿Qué querés cargar?</h2>
      <p class="hint">Elegí si es plata que entra o que sale.</p>
      <div class="bigchoice">
        <button class="in ${wiz.tipo==='ingreso'?'sel':''}" onclick="wizSet('tipo','ingreso')"><span class="em">💰</span>Ingreso</button>
        <button class="out ${wiz.tipo==='gasto'?'sel':''}" onclick="wizSet('tipo','gasto')"><span class="em">🛒</span>Gasto</button>
      </div>`;
  }
  else if(s===1){
    const cls=wiz.tipo==='ingreso'?'in':'out';
    body.innerHTML=`
      <h2>¿De cuánto?</h2>
      <p class="hint">Ingresá el importe del ${wiz.tipo}.</p>
      <div class="amount-box">
        <span class="cur">$</span>
        <input id="wizAmt" class="${cls}" type="number" inputmode="decimal" placeholder="0" value="${wiz.importe}"
          oninput="wiz.importe=this.value; document.getElementById('wizNext').disabled=!(Number(this.value)>0)">
      </div>`;
    setTimeout(()=>{const a=document.getElementById('wizAmt');a&&a.focus()},120);
  }
  else if(s===2){
    const cats=state.categorias.filter(c=>c.tipo===wiz.tipo);
    body.innerHTML=`
      <h2>¿Qué tipo de ${wiz.tipo}?</h2>
      <p class="hint">Elegí una categoría o creá una nueva.</p>
      <div class="chips" id="wizChips">
        ${cats.map(c=>`<button class="c ${wiz.categoria_id===c.id?'sel':''}" onclick="wizSet('categoria_id','${c.id}')"><span class="dot" style="background:${c.color}"></span>${c.nombre}</button>`).join('')}
        <button class="c add" onclick="wizAddCatPrompt()">＋ Añadir nueva</button>
      </div>`;
  }
  else if(s===3){
    body.innerHTML=`
      <h2>Detalles</h2>
      <p class="hint">Ámbito, fecha y si es un pago fijo o único.</p>
      <div class="frm">
        <label>Ámbito</label>
        <div class="toggle2">
          <button class="${wiz.ambito==='individual'?'sel':''}" onclick="wizSet('ambito','individual')">👤 Individual</button>
          <button class="${wiz.ambito==='compartido'?'sel':''}" onclick="wizSet('ambito','compartido')">👥 Compartido</button>
        </div>
        <label>Fecha</label>
        <input type="date" value="${wiz.fecha}" oninput="wiz.fecha=this.value">
        <label>Tipo de pago</label>
        <div class="toggle2">
          <button class="${wiz.modo==='unico'?'sel':''}" onclick="wizSet('modo','unico')">Único</button>
          <button class="${wiz.modo==='fijo'?'sel':''}" onclick="wizSet('modo','fijo')">Fijo / recurrente</button>
        </div>
        <div id="freqWrap" style="${wiz.modo==='fijo'?'':'display:none'}">
          <label>Frecuencia</label>
          <select onchange="wiz.frecuencia=this.value">
            <option value="mensual" ${wiz.frecuencia==='mensual'?'selected':''}>Mensual</option>
            <option value="semanal" ${wiz.frecuencia==='semanal'?'selected':''}>Semanal</option>
            <option value="anual" ${wiz.frecuencia==='anual'?'selected':''}>Anual</option>
          </select>
        </div>
        <label>Fecha de vencimiento <span style="font-weight:400;color:var(--ink-faint)">(opcional, para recordatorios)</span></label>
        <input type="date" value="${wiz.fecha_vencimiento}" oninput="wiz.fecha_vencimiento=this.value">
      </div>`;
  }
  else if(s===4){
    body.innerHTML=`
      <h2>Comentario y foto</h2>
      <p class="hint">Opcional. Sumá una nota o el ticket.</p>
      <div class="frm">
        <label>Comentario</label>
        <textarea rows="2" placeholder="Ej: compra del super, regalo, etc." oninput="wiz.comentario=this.value">${wiz.comentario}</textarea>
        <label>Foto / comprobante</label>
        <div class="photo-drop" onclick="document.getElementById('wizPhoto').click()">📷 Tocá para añadir una foto</div>
        <input id="wizPhoto" type="file" accept="image/*" style="display:none" onchange="wizPhoto(this)">
        <div id="photoPrev">${wiz.foto?photoPrevHtml():''}</div>
      </div>
      ${wizSummary()}`;
  }
  // habilitar / deshabilitar next
  syncWizNext();
}
function syncWizNext(){
  const s=wiz.step; const n=document.getElementById('wizNext'); n.disabled=false;
  if(s===0 && !wiz.tipo) n.disabled=true;
  if(s===1 && !(Number(wiz.importe)>0)) n.disabled=true;
  if(s===2 && !wiz.categoria_id) n.disabled=true;
}
function wizSet(k,v){ wiz[k]=v; renderWiz(); }
function wizPrev(){ if(wiz.step>0){wiz.step--; renderWiz();} }
async function wizNext(){
  const s=wiz.step;
  if(s===0 && !wiz.tipo) return;
  if(s===1 && !(Number(wiz.importe)>0)) return;
  if(s===2 && !wiz.categoria_id) return;
  if(s<WIZ_STEPS-1){ wiz.step++; renderWiz(); return; }
  await saveWiz();
}
async function wizAddCatPrompt(){
  const nombre=prompt('Nombre de la nueva categoría:'); if(!nombre||!nombre.trim()) return;
  const color=PALETTE[state.categorias.length % PALETTE.length];
  const row=await db.createCategoria({nombre:nombre.trim(),tipo:wiz.tipo,color});
  await refreshData(); wiz.categoria_id=row.id; renderWiz();
}
function wizPhoto(input){
  const f=input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ wiz.foto=r.result; document.getElementById('photoPrev').innerHTML=photoPrevHtml(); };
  r.readAsDataURL(f);
}
function photoPrevHtml(){
  return `<div class="photo-prev"><img src="${wiz.foto}"><button class="rm" onclick="wiz.foto=null;document.getElementById('photoPrev').innerHTML=''">✕</button></div>`;
}
function wizSummary(){
  return `<div class="summary">
    <div class="row"><span class="k">Tipo</span><span class="v ${wiz.tipo==='ingreso'?'txt-in':'txt-out'}">${wiz.tipo==='ingreso'?'Ingreso':'Gasto'}</span></div>
    <div class="row"><span class="k">Importe</span><span class="v num">${fmt(Number(wiz.importe))}</span></div>
    <div class="row"><span class="k">Categoría</span><span class="v">${catName(wiz.categoria_id)}</span></div>
    <div class="row"><span class="k">Ámbito</span><span class="v">${wiz.ambito==='compartido'?'Compartido':'Individual'}</span></div>
    <div class="row"><span class="k">Pago</span><span class="v">${wiz.modo==='fijo'?'Fijo · '+wiz.frecuencia:'Único'}</span></div>
    ${wiz.fecha_vencimiento?`<div class="row"><span class="k">Vence</span><span class="v">${fmtDate(wiz.fecha_vencimiento)}</span></div>`:''}
  </div>`;
}
async function saveWiz(){
  const n=document.getElementById('wizNext'); n.disabled=true; n.textContent='Guardando...';
  try{
    await db.createMovimiento({
      tipo:wiz.tipo, importe:Number(wiz.importe), categoria_id:wiz.categoria_id,
      comentario:wiz.comentario||null, ambito:wiz.ambito,
      es_fijo: wiz.modo==='fijo', frecuencia: wiz.modo==='fijo'?wiz.frecuencia:'unico',
      fecha:wiz.fecha, fecha_vencimiento:wiz.fecha_vencimiento||null, foto:wiz.foto||null
    });
    await refreshData(); closeWizard(); render();
    toast(wiz.tipo==='ingreso'?'Ingreso cargado ✓':'Gasto cargado ✓');
  }catch(err){
    alert('Error al guardar: '+(err.message||err));
    n.disabled=false; n.textContent='Guardar';
  }
}

/* =========================================================
   TOAST
   ========================================================= */
let toastT=null;
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200);
}

/* =========================================================
   ARRANQUE
   ========================================================= */
(async function init(){
  if(!USE_SUPABASE){ document.getElementById('demoBadge').style.display='block'; }
  else {
    document.getElementById('demoBadge').style.display='none';
    const u=await db.currentUser();
    if(u){ await enterApp(u); return; }
  }
  setAuthMode('login');
})();
</script>
</body>
</html>
